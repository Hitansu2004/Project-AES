# ============================================================
# AES Customer Portal — Common Application Properties
# Active profile is selected via SPRING_PROFILES_ACTIVE
# (defaults to "dev" via application-dev.properties).
# ============================================================

# ─── Server ────────────────────────────────────────────────
server.port=8080
spring.application.name=aes-backend
spring.profiles.active=dev

# ─── Local secrets override (git-ignored) ──────────────────
# Loads `application-secrets.properties` from the project root at runtime.
# Use this file to keep real API keys / passwords on your local machine
# without committing them. The `optional:` prefix means the app boots
# fine on any machine that doesn't have the file (e.g. CI, prod).
spring.config.import=optional:file:./application-secrets.properties,optional:file:../application-secrets.properties

# ─── Database (PostgreSQL 16) ──────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/aes_db
spring.datasource.username=aes_user
spring.datasource.password=aes_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
# SQL printing is OFF by default; toggle it on with `app.log-sql=true` only
# when you genuinely need to inspect a query (see RequestLoggingFilter for
# the per-request access log we use instead).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# The dialect is auto-detected from the JDBC driver — explicitly setting it
# triggers HHH90000025 on Hibernate 6.x.
spring.jpa.open-in-view=false

# ─── Flyway Migrations ─────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─── JWT (Section 7, lines 1680-1684) ──────────────────────
jwt.secret=${JWT_SECRET:aes-customer-portal-256bit-secret-key-2024-secure-random-value}
jwt.access-token-expiry=900
jwt.refresh-token-expiry=604800

# ─── Twilio SMS (Section 4.1 + 14, lines 1947-1949 / 2072) ─
# Demo builds log the OTP only; real Twilio credentials activate live SMS.
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}

# ─── App Configuration (Section 6 + 10) ────────────────────
# Demo mode is overridden per-profile (dev=true, prod=false).
app.demo-mode=false
app.demo-otp-bypass=
app.escalation.l1-timeout-minutes=30
app.escalation.l2-timeout-minutes=60

# Workflow re-design (PLAN.md / FLOW.md)
# Default OFF so Phase 1 is non-breaking. Flip to true once the Ops
# Manager triage dashboard (Phase 2) is live.
app.workflow.ops-triage-enabled=false

# Assignment-offer windows (Ops -> CRM, CRM -> Engineer).
app.offer.crm-expiry-minutes=15
app.offer.engineer-expiry-minutes=10

# New SLA ladder — L2 SLA breach should NOT auto-transfer to admin; it
# just raises an alert on the admin dashboard. Set to false to fall
# back to the legacy auto-bump behaviour.
app.escalation.l3-monitor-only=true

# ─── Google Maps (server-side: Geocoding + Distance Matrix + Directions) ─
# Provide the real key via the GOOGLE_MAPS_BACKEND_KEY environment variable.
# Never commit a live API key here — the empty default keeps builds green
# but disables Maps calls until the env var is set.
app.google.maps-key=${GOOGLE_MAPS_BACKEND_KEY:}
# AES head office coordinates — origin for all distance/route calculations.
# Default = Banjara Hills, Hyderabad. Override per deployment if needed.
app.aes.office.lat=${AES_OFFICE_LAT:17.4156}
app.aes.office.lng=${AES_OFFICE_LNG:78.4347}
app.aes.office.address=${AES_OFFICE_ADDRESS:Arial Engineering Services, Banjara Hills, Hyderabad}

# ─── Service Pricing Bands (rupees) ────────────────────────
# Base charge by AC type
app.pricing.base.split=750
app.pricing.base.cassette=1500
app.pricing.base.ductable=2500
app.pricing.base.vrf=5000
app.pricing.base.vrv=5000
app.pricing.base.ahu=5000
app.pricing.base.window=750
app.pricing.base.default=750
# Distance surcharges (km thresholds → rupees)
app.pricing.distance.threshold1=10
app.pricing.distance.threshold2=15
app.pricing.distance.threshold3=25
app.pricing.distance.charge1=0
app.pricing.distance.charge2=250
app.pricing.distance.charge3=750
app.pricing.distance.charge4=1250

# ─── Mock Payment Gateway (Razorpay-style demo) ────────────
# Set to false once you wire a real gateway (Razorpay/Cashfree).
app.payment.mock-mode=true
app.payment.mock-success-otp=0000

# ─── CORS ──────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Logging ───────────────────────────────────────────────
# Patterns + framework levels live in logback-spring.xml so we keep one source
# of truth. These keys only nudge our own packages.
logging.level.com.aes=INFO
logging.level.com.aes.config.RequestLoggingFilter=INFO

# ─── SpringDoc OpenAPI ─────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
